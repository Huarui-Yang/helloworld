<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f8ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .container { text-align: center; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,.1); }
    h1 { color: #3498db; }
    p { color: #555; }
    button { background: #3498db; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; }
    button:hover { background: #217dbb; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌍 Hello World!</h1>
    <p>Welcome to my first webpage!</p>
    <button onclick="alert('Hello! Have a wonderful day! 😊')">Click Me!</button>
  </div>
</body>
</html>
